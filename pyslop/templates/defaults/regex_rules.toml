# Packaged regex rules. Overlay fix/name in pyslop.toml without copying this file.

ignore = [
  "**/.*/**",
  ".*",
  "**/.*",
  "*.toml",
  "**/*.toml",
  "*.yml",
  "**/*.yml",
  "*.yaml",
  "**/*.yaml",
  "*.md",
  "**/*.md",
  "*.txt",
  "**/*.txt",
  "uv.lock",
  "**/uv.lock",
  "pyslop_extensions/**",
  "pyslop/**",
]

[rules."slop-words.todo"]
name = "Trigger word: todo"
fix = "Resolve the TODO before shipping."

[rules."slop-words.todo".detect]
kind = "regex"
pattern = '(?i)(?:#\s*todo|//\s*todo)'

[rules."slop-words.dead-code"]
name = "Trigger word: dead code"
fix = "Delete dead code."

[rules."slop-words.dead-code".detect]
kind = "regex"
pattern = '(?i)(?<!\w)dead\ code(?!\w)'

[rules."slop-words.cleanup-later"]
name = "Trigger word: cleanup later"
fix = "Do the cleanup now."

[rules."slop-words.cleanup-later".detect]
kind = "regex"
pattern = '(?i)(?<!\w)cleanup\ later(?!\w)'

