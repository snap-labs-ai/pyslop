[mypy]
follow_imports = skip
show_column_numbers = True
show_error_codes = True
show_error_context = False
error_summary = False
color_output = False
ignore_missing_imports = True
explicit_package_bases = True
disable_error_code = operator,name-defined
exclude = (^|.*/)alembic/.*

[mypy-reflex_resizable_panels.*]
ignore_missing_imports = True
