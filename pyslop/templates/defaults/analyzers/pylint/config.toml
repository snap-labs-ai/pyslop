# Pylint is CI-only (`--stage ci`) and only for checks Ruff does not implement.
# Pylint-equivalent refactor/design rules are Ruff `PL` (`[lint.pylint]` thresholds).
# `cyclic-import` needs a whole-graph run; it is not in Ruff.

[tool.pylint.main]
ignore-paths = [
  '(^|.*[\\/])alembic[\\/].*',
  '(^|.*[\\/])scripts[\\/].*',
  '(^|.*[\\/])tests[\\/].*',
  '(^|.*[\\/])test_.*\\.py$',
  '(^|.*[\\/]).*_test\\.py$',
]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "cyclic-import",
]
